<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velstats.AI Assistant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      height: 100vh;
      background: 
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url('https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .hero {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 3rem;
      max-width: 700px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      color: #ffffff;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      color: #e0e0e0;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Chatbot Floating Button */
    .chatbot-button {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .chatbot-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }

    /* Chatbot Window */
    .chatbot-window {
      position: fixed;
      bottom: 100px;
      left: 25px;
      width: 340px;
      height: 460px;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(12px);
      animation: popup 0.4s ease;
    }

    @keyframes popup {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .chat-header {
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .chat-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.3;
      word-wrap: break-word;
    }

    .message.user {
      background-color: #d0e4ff;
      margin-left: auto;
      color: #003366;
    }

    .message.assistant {
      background-color: #e2e2e2;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: #333;
      border-bottom-left-radius: 12px;
    }

    .chat-input button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 0 1rem;
      cursor: pointer;
      border-bottom-right-radius: 12px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .hero { padding: 2rem; margin: 1rem; }
      h1 { font-size: 2rem; }
      .chatbot-window { width: 90%; left: 5%; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Welcome to Velstats.AI</h1>
    <p>Experience the power of intelligent data understanding. Our RAG-based assistant combines precision and performance to help you make smarter, faster decisions — powered by real-time AI knowledge retrieval.</p>
  </div>

  <!-- Chatbot -->
  <button class="chatbot-button" id="chatToggle">💬</button>

  <div class="chatbot-window" id="chatWindow">
    <div class="chat-header">Velstats AI Assistant</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask your question..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const BASE_URL = "http://localhost:3000";
    const chatToggle = document.getElementById("chatToggle");
    const chatWindow = document.getElementById("chatWindow");
    const chatBody = document.getElementById("chatBody");
    const sendBtn = document.getElementById("sendBtn");
    const userInput = document.getElementById("userInput");

    chatToggle.onclick = () => {
      chatWindow.style.display = chatWindow.style.display === "flex" ? "none" : "flex";
    };

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chatBody.appendChild(msg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    sendBtn.onclick = async () => {
      const question = userInput.value.trim();
      if (!question) return;
      addMessage(question, "user");
      userInput.value = "";
      addMessage("Thinking...", "assistant");

      try {
        const res = await fetch(`${BASE_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();
        chatBody.lastChild.textContent = data.answer || "No response.";
      } catch (err) {
        chatBody.lastChild.textContent = "Error fetching answer.";
      }
    };
  </script>
</body>
</html>
